name: Monitor de passagens

on:
  schedule:
    # 3x por dia (horário de Fortaleza: ~07h, 13h e 20h)
    # Recife-Fortaleza: 2 buscas x 3 rodadas; Brasil: 1 busca na rodada das 07h
    # ≈ 217 buscas/mês (plano grátis da SerpApi = 250)
    - cron: "7 10 * * *"
    - cron: "7 16 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Buscar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          ORIGEM: ${{ vars.ORIGEM || 'REC' }}
          DESTINO: ${{ vars.DESTINO || 'FOR' }}
          DATA_IDA: ${{ vars.DATA_IDA || '2027-01-29' }}
          DATA_VOLTA: ${{ vars.DATA_VOLTA || '2027-01-31' }}
          PRECO_MAXIMO: ${{ vars.PRECO_MAXIMO || '600' }}
          PRECO_OTIMO: ${{ vars.PRECO_OTIMO || '500' }}
          URL_PAGINA: ${{ vars.URL_PAGINA }}
        run: python monitor.py ${{ github.event_name == 'workflow_dispatch' && '--brasil' || '' }}

      - name: Salvar histórico e página
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add historico_precos.json docs/index.html
          git diff --cached --quiet || git commit -m "Atualiza preços"
          git push
